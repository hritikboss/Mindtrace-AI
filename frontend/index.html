<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8ff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="MindTrace AI - learn smarter, understand your mistakes, master every concept." />
    <title>MindTrace AI</title>
    <script>
      /* Apply the saved/system theme before first paint to avoid a flash. */
      (function () {
        try {
          var t = localStorage.getItem("mindtrace-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var r = document.documentElement;
          if (t === "dark") r.classList.add("dark");
          r.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#0b1020" : "#f6f8ff");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
